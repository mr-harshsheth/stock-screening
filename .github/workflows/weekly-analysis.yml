name: Weekly Scheduled Analysis

# Cron is UTC only and does NOT shift for US daylight saving. 21:00 UTC is:
#   - 5:00 PM EDT (US Eastern, Mar-Nov, daylight saving)
#   - 4:00 PM EST (US Eastern, Nov-Mar, standard time)
# See README.md "GitHub Actions cron timing" section if you want it to always
# fire at a fixed *local* clock time.
on:
  schedule:
    - cron: "0 21 * * 5"
  workflow_dispatch: {} # lets you trigger this exact workflow manually from the Actions tab for testing

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run analysis
        run: python scripts/analyze.py --run-type scheduled

      - name: Send email notification
        continue-on-error: true # a broken SMTP secret shouldn't stop results from being committed
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          NOTIFY_EMAIL_TO: ${{ secrets.NOTIFY_EMAIL_TO }}
        run: python scripts/notify.py

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/results.json docs/data/history.json
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Automated: scheduled Friday analysis results"
            git push
          fi
